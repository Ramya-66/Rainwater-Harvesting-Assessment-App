<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RainIQ – Smart Rainwater Harvesting</title>

<style>
/* --- base --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;

  background: url("{{ url_for('static', filename='images/house.jpeg') }}") center/cover no-repeat,
              linear-gradient(180deg,#08306b 0%,#1464b6 55%,#1976d2 100%);
}

/* --- navbar --- */
.navbar {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 20px;
}
.nav-left { display:flex; align-items:center; gap:18px; }
.logo { display:flex; align-items:center; gap:10px; font-weight:600; font-size:20px; }
.logo .mark {
  width:40px; height:40px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center;
}
.menu { display:flex; gap:22px; margin-left:6px; }
.menu a {
  text-decoration:none; color:rgba(255,255,255,0.95);
  font-weight:600; letter-spacing:0.6px;
}
.nav-right { display:flex; gap:18px; align-items:center; color:rgba(255,255,255,0.95); }
.icon { width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon svg { width:22px; height:22px; fill:rgba(255,255,255,0.95); }

/* --- hero --- */
.hero {
  width:100%;
  max-width:1200px;
  text-align:center;
  padding:10px 20px 0 20px;
  margin-top:10px;
}
.hero h1 {
  font-size: clamp(28px,5vw,56px);
  font-weight:700;
  line-height:1.02;
  margin-top:8px;
  margin-bottom:28px;
  text-shadow:0 6px 22px rgba(3,12,60,0.25);
}

/* --- calculator button --- */
.calc-btn {
  display: inline-block;
  background: #1a7f42;
  color: #fff;
  padding: 14px 32px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 600;
  font-size: 1.2rem;
  transition: background 0.3s;
  margin-top: 20px;
}
.calc-btn:hover { background: #145c2f; }

/* --- slider --- */
.slider {
  width:80%;
  max-width:820px;
  margin:0 auto;
  border-radius:14px;
  padding:32px 36px;
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 30px rgba(2,10,40,0.18);
  backdrop-filter: blur(4px);
  position: relative;
}
.slide-text {
  font-size: clamp(16px,2vw,20px);
  color: #fff;
  max-width:780px;
  transition: opacity 620ms ease;
  opacity:1;
  text-align:left;
  line-height:1.6;
  font-weight:600;
  padding: 12px 16px;
  border-radius: 8px;
}

/* --- login form --- */
.login-row {
  margin-top:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.input-wrapper {
  position: relative;
  width: 420px;
  max-width: 78%;
  display:flex;
  flex-direction: column;
  gap: 10px;
}
.email {
  border-radius: 40px;
  padding: 14px 22px;
  width: 100%;
  border: none;
  font-size: 16px;
  outline: none;
}
.login-btn {
  background: #1a7f42;
  color: #fff;
  padding: 14px;
  border-radius: 30px;
  border: none;
  font-weight:700;
  cursor:pointer;
  transition: background 0.3s;
}
.login-btn:hover { background: #145c2f; }
.error-msg { color: #ff8080; font-weight:600; margin-bottom: 10px; }

/* --- welcome message --- */
.welcome-msg {
  text-align: center;
  margin: 20px;
  font-size: 18px;
  color: #ffff80;
}

/* --- responsive --- */
@media (max-width:820px){
  .slider { width:90%; padding:22px; min-height:180px; }
  .email { padding-right: 0; }
}
@media (max-width:480px){
  .navbar { padding:12px; }
  .menu a { font-size:14px; }
  .logo { font-size:18px; }
  .slide-text { font-size:15px; }
  .input-wrapper { width: 90%; }
}
</style>
</head>
<body>

<header class="navbar" role="navigation">
  <div class="nav-left">
    <div class="logo">
      <div class="mark">💧</div>
      <div>RainIQ</div>
    </div>
    <nav class="menu">
      <a href="/home">HOME</a>
      {% if user %}
      <a href="/calculator">CALCULATOR</a>
      <a href="/logout" style="color:yellow;">LOGOUT</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="hero">
  {% if user %}
    <div class="welcome-msg">Welcome, {{ user }} 👋</div>
  {% endif %}

  <h1>Welcome to Smart Rainwater Harvesting</h1>

  <!-- Slider -->
  <div class="slider" aria-live="polite">
    <div class="slide-text" id="slideText">User-friendly</div>
  </div>

  <!-- Call-to-Action Button (visible only after login) -->
{% if user %}
  <a class="calc-btn" href="{{ url_for('calculator') }}">Go to Calculator</a>
{% endif %}


  <!-- Login (visible only if not logged in) -->
  {% if not user %}
  <div class="login-row">
    <form class="input-wrapper" method="POST" action="/login">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <input class="email" name="username" type="text" placeholder="Enter username" required />
      <input class="email" name="password" type="password" placeholder="Enter password" required />
      <button class="login-btn" type="submit">LOGIN</button>
    </form>
  </div>
  {% endif %}
</main>

<script>
(function () {
  const texts = [
    "User-friendly — clear inputs, instant feedback, minimal steps.",
    "On-spot assessment — estimate harvest potential by location and roof area.",
    "Feasibility analysis — suggested recharge types and structural sizing.",
    "Cost & benefit — quick estimates to support decision-making."
  ];
  const slideTextEl = document.getElementById("slideText");
  let idx = 0;
  const intervalMs = 3000;
  const fadeDuration = 620;

  function showNext() {
    slideTextEl.style.opacity = 0;
    setTimeout(() => {
      idx = (idx + 1) % texts.length;
      slideTextEl.innerText = texts[idx];
      slideTextEl.style.opacity = 1;
    }, fadeDuration);
  }
  setInterval(showNext, intervalMs);
})();
</script>

</body>
</html>
